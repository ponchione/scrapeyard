name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_VERSION: "26.1.2"
  POETRY_VERSION: "2.3.4"
  POETRY_EXPORT_VERSION: "1.10.0"

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache immutable dependency downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pypoetry/artifacts
          key: quality-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: quality-${{ runner.os }}-py${{ matrix.python-version }}-
      - name: Install pinned Poetry tooling
        run: |
          python -m pip install --upgrade pip==${PIP_VERSION}
          python -m pip install poetry==${POETRY_VERSION} poetry-plugin-export==${POETRY_EXPORT_VERSION}
          python scripts/check_packaging_toolchain.py
      - name: Validate and install the locked environment
        run: |
          poetry check --lock
          poetry sync --no-interaction
      - name: Lint
        run: poetry run ruff check src tests scripts
      - name: Enforce the browser security review
        run: poetry run python scripts/audit_browser_security.py --dockerfile Dockerfile
      - name: Type check
        run: poetry run mypy src
      - name: Test with coverage
        run: poetry run pytest -W error --junitxml=test-results/junit.xml --cov-report=xml:coverage.xml
      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-python-${{ matrix.python-version }}-diagnostics
          path: |
            test-results/junit.xml
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Distribution build / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Cache immutable dependency downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pypoetry/artifacts
          key: build-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}
          restore-keys: build-${{ runner.os }}-py3.12-
      - name: Install pinned Poetry tooling
        run: |
          python -m pip install --upgrade pip==${PIP_VERSION}
          python -m pip install poetry==${POETRY_VERSION} poetry-plugin-export==${POETRY_EXPORT_VERSION}
          python scripts/check_packaging_toolchain.py
      - name: Validate the lock file and build wheel and sdist
        run: |
          poetry check --lock
          poetry build
      - name: Verify deterministic production dependency export
        run: |
          export_dir="$(mktemp -d)"
          trap 'rm -rf "${export_dir}"' EXIT
          python scripts/audit_dependencies.py export-production --output "${export_dir}/first.txt"
          python scripts/audit_dependencies.py export-production --output "${export_dir}/second.txt"
          cmp "${export_dir}/first.txt" "${export_dir}/second.txt"
      - name: Inspect packaged SQL migrations
        run: |
          python scripts/inspect_distribution.py dist
          python scripts/smoke_install_distribution.py dist
      - name: Upload built distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  live-redis:
    name: Live Redis / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4.9-alpine3.21@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SCRAPEYARD_API_CREDENTIALS: '{"live-redis-ci":{"secret":"live-redis-ci-key-0000","scopes":["submit","read","schedule-admin","delete"]},"live-redis-health":{"secret":"live-redis-health-key-0000","scopes":["health-detail"]}}'
      SCRAPEYARD_HEALTH_PROBE_API_KEY: live-redis-health-key-0000
      SCRAPEYARD_REDIS_DSN: redis://127.0.0.1:6379/15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Cache immutable dependency downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pypoetry/artifacts
          key: live-redis-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}
          restore-keys: live-redis-${{ runner.os }}-py3.12-
      - name: Install pinned Poetry tooling
        run: |
          python -m pip install --upgrade pip==${PIP_VERSION}
          python -m pip install poetry==${POETRY_VERSION} poetry-plugin-export==${POETRY_EXPORT_VERSION}
          python scripts/check_packaging_toolchain.py
      - name: Install the locked environment
        run: poetry sync --no-interaction
      - name: Exercise the authenticated real Redis/arq path
        run: >-
          poetry run pytest -W error --no-cov -m live_redis tests/live_redis -q
          --junitxml=test-results/live-redis.xml
      - name: Capture Redis diagnostics on failure
        if: failure()
        run: |
          mkdir -p diagnostics
          docker logs "${{ job.services.redis.id }}" > diagnostics/redis.log 2>&1 || true
      - name: Upload live Redis diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-redis-diagnostics
          path: |
            test-results/live-redis.xml
            diagnostics/redis.log
          if-no-files-found: ignore
          retention-days: 7
