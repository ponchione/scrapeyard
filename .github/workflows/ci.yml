name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_VERSION: "26.2.1"
  POETRY_VERSION: "2.3.4"
  POETRY_EXPORT_VERSION: "1.10.0"

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache immutable dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pypoetry/artifacts
          key: quality-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: quality-${{ runner.os }}-py${{ matrix.python-version }}-
      - name: Install pinned Poetry tooling
        run: |
          python -m pip install --upgrade "pip==${PIP_VERSION}"
          python -m pip install "poetry==${POETRY_VERSION}" "poetry-plugin-export==${POETRY_EXPORT_VERSION}"
          python scripts/check_packaging_toolchain.py
      - name: Validate and install the locked environment
        run: |
          poetry check --lock
          poetry sync --no-interaction
      - name: Lint
        run: poetry run ruff check src tests scripts security
      - name: Type check
        # mypy checks against python_version 3.10 from pyproject.toml whatever
        # the interpreter, so a second leg would repeat the same run.
        if: matrix.python-version == '3.10'
        run: poetry run mypy src
      - name: Test with coverage
        run: poetry run pytest -W error --junitxml=test-results/junit.xml --cov-report=xml:coverage.xml
      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-python-${{ matrix.python-version }}-diagnostics
          path: |
            test-results/junit.xml
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Distribution build / Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Cache immutable dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pypoetry/artifacts
          key: build-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}
          restore-keys: build-${{ runner.os }}-py3.12-
      - name: Install pinned Poetry tooling
        run: |
          python -m pip install --upgrade "pip==${PIP_VERSION}"
          python -m pip install "poetry==${POETRY_VERSION}" "poetry-plugin-export==${POETRY_EXPORT_VERSION}"
          python scripts/check_packaging_toolchain.py
      - name: Validate the lock file and build wheel and sdist
        run: |
          poetry check --lock
          poetry build
      - name: Verify deterministic production dependency export
        run: |
          export_dir="$(mktemp -d)"
          trap 'rm -rf "${export_dir}"' EXIT
          python scripts/audit_dependencies.py export-production --output "${export_dir}/first.txt"
          python scripts/audit_dependencies.py export-production --output "${export_dir}/second.txt"
          cmp "${export_dir}/first.txt" "${export_dir}/second.txt"
      - name: Inspect packaged SQL migrations
        run: |
          python scripts/inspect_distribution.py dist
          python scripts/smoke_install_distribution.py dist
      - name: Upload built distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  live-redis:
    name: Live Redis / Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SCRAPEYARD_API_CREDENTIALS: '{"live-redis-ci":{"secret":"live-redis-ci-key-0000","scopes":["submit","read","schedule-admin","delete","health-detail"]}}'
      SCRAPEYARD_REDIS_DSN: redis://127.0.0.1:6379/15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Cache immutable dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pypoetry/artifacts
          key: live-redis-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}
          restore-keys: live-redis-${{ runner.os }}-py3.12-
      - name: Install pinned Poetry tooling
        run: |
          python -m pip install --upgrade "pip==${PIP_VERSION}"
          python -m pip install "poetry==${POETRY_VERSION}" "poetry-plugin-export==${POETRY_EXPORT_VERSION}"
          python scripts/check_packaging_toolchain.py
      - name: Install the locked environment
        run: poetry sync --no-interaction
      - name: Enable Redis append-only persistence
        # Service containers take no command arguments, so --appendonly yes
        # can't be passed at start; production Compose starts Redis with it.
        run: |
          docker exec "${{ job.services.redis.id }}" redis-cli CONFIG SET appendonly yes
          test "$(docker exec "${{ job.services.redis.id }}" redis-cli CONFIG GET appendonly | tail -n 1)" = yes
      - name: Exercise the authenticated real Redis/arq path
        run: >-
          poetry run pytest -W error --no-cov -m live_redis tests/live_redis -q
          --junitxml=test-results/live-redis.xml
      - name: Capture Redis diagnostics on failure
        if: failure()
        run: |
          mkdir -p diagnostics
          docker logs "${{ job.services.redis.id }}" > diagnostics/redis.log 2>&1 || true
      - name: Upload live Redis diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-redis-diagnostics
          path: |
            test-results/live-redis.xml
            diagnostics/redis.log
          if-no-files-found: ignore
          retention-days: 7
