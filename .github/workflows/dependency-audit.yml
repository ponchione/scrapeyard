name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache immutable dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pypoetry/artifacts
          key: dependency-audit-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: dependency-audit-${{ runner.os }}-py${{ matrix.python-version }}-
      - name: Install compatible Poetry tooling
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install poetry==2.3.4 poetry-plugin-export==1.10.0 pip-audit==2.10.0
          # The 3.10 runner image preinstalls an audited-vulnerable setuptools
          # that no packaging tool here uses.
          python -m pip uninstall -y setuptools
          python scripts/check_packaging_toolchain.py
      - name: Audit packaging tooling
        run: python -m pip_audit --local --progress-spinner=off
      - name: Install the locked development environment
        run: |
          poetry sync --no-interaction
          # Poetry seeds its environment with virtualenv's bundled pip.
          poetry run python -m pip install --upgrade pip==26.2.1
      - name: Audit development and production dependencies
        run: poetry run python scripts/audit_dependencies.py all
