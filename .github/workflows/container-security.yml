name: Container security and SBOM

on:
  pull_request:
    paths:
      - Dockerfile
      - docker-compose.yml
      - docker-compose.local.yml
      - docker-compose.smoke.yml
      - poetry.lock
      - pyproject.toml
      - security/**
      - scripts/container-entrypoint.sh
      - scripts/run_container_security_scan.sh
      - .github/workflows/container-security.yml
  push:
    branches: [main]
  schedule:
    - cron: "41 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-security-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Pinned image / SBOM / vulnerability and config scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the immutable-input production image
        run: docker build --pull --tag scrapeyard:security-scan .
      - name: Generate CycloneDX SBOM and enforce scans
        run: ./scripts/run_container_security_scan.sh scrapeyard:security-scan
      - name: Upload bounded security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-security-reports
          path: artifacts/container-security/
          if-no-files-found: warn
          retention-days: 14
