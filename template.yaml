# Copy this file into a project and replace the example values.

project: example-project
name: example-scrape

target:
  url: "https://example.com/catalog"
  fetcher: dynamic
  # Optional override for adaptive fingerprint sharing.
  # adaptive_domain: example.com
  # Optional per-target proxy override (takes precedence over job-level proxy).
  # proxy:
  #   url: "http://user:pass@gate.provider.com:7777"
  browser:
    timeout_ms: 90000
    disable_resources: true
    network_idle: false
    # Optional: abort subrequests the extraction does not need (see run_budget.traffic).
    # block_third_party: true
    # third_party_allow_hosts: [static.example-cdn.com]
    # block_url_patterns: ["*/collect?*"]
    # Optional ordered browser actions before extraction.
    # actions:
    #   - type: click
    #     selector: "#accept-cookies"
    #     optional: true
    #   - type: scroll
    #     times: 3
    #     wait_ms: 500
    #   - type: repeat_click
    #     selector: "button.load-more"
    #     max_times: 5
    #     wait_for_selector: ".catalog-item"
    #     wait_ms: 500
    #     optional: true
  item_selector: ".catalog-item"
  selectors:
    title:
      query: ".item-title::text"
      transform: "trim|collapse_whitespace"
    price:
      query: ".item-price::text"
      transform: trim
    link:
      query: "a::attr(href)"
      transform: prepend("https://example.com")
  # MAP pricing detection (optional). Numeric prices are always classified as
  # explicit; use this block for non-numeric sentinel values and retailer cues
  # that indicate pricing_visibility states.
  # map_detection:
  #   text_patterns:
  #     - "add to cart to see price"
  #     - "call for price"
  #   css_selectors:
  #     - ".map-price-message"
  #   price_value_patterns:
  #     - "<hidden-price>"
  # Stock status detection (optional). Patterns keyed by status value.
  # `stock_signal` is checked first, then DOM text and CSS selectors, so use
  # it when you want the raw availability text to participate in detection.
  # `stock_status` is system-generated from stock_detection; use a selector
  # like `stock_signal` if you want to preserve raw availability text.
  # Legacy raw `stock_status` selector output is copied into `stock_signal`
  # during enrichment only when `stock_signal` is missing or blank. New
  # configs should use `stock_signal` directly.
  # stock_detection:
  #   in_stock:
  #     text_patterns: ["in stock", "available"]
  #   out_of_stock:
  #     text_patterns: ["out of stock", "sold out"]
  pagination:
    next:
      query: ".pagination-next"
      type: css
    max_pages: 5
    # Alternatives: `page_param: page` (optionally `page_first`/`page_step`) when
    # pages are addressed by a query parameter, or `mode: click` to click `next`
    # in the live page for dynamic/stealthy client-rendered listings.

# Optional override. If omitted, adaptive defaults to false for on-demand jobs
# and true for scheduled jobs.
adaptive: true

# Optional job-level proxy (applies to all targets unless overridden).
# `{session}` in the credentials becomes one random token per run.
# proxy:
#   url: "http://user-session-{session}:pass@gate.provider.com:7777"

retry:
  max_attempts: 3
  backoff: exponential
  backoff_max: 30
  # retryable_status: [429, 500, 502, 503, 504]

validation:
  required_fields: [title, link]
  min_results: 1
  on_empty: retry

execution:
  concurrency: 2
  delay_between: 2
  domain_rate_limit: 3
  mode: auto
  priority: normal
  fail_strategy: partial
  # Per-host cap on top-level page attempts per UTC day, shared across runs.
  # Can only lower a nonzero SCRAPEYARD_DOMAIN_DAILY_PAGE_LIMIT.
  # domain_daily_page_limit: 200
  # Development aid (requires SCRAPEYARD_PAGE_CACHE_DIR): "record" stores
  # rendered pages; "replay" re-runs extraction on them with no requests.
  # Replayed output is not a live observation of the site.
  # page_cache: "off"

# Uncomment for recurring jobs.
# schedule:
#   cron: "0 * * * *"
#   enabled: true

output:
  group_by: target

# Uncomment to notify another system when this job finishes.
# webhook:
#   url: "https://example.com/webhooks/scrapeyard"
#   on: [complete, partial, failed]
#   headers:
#     Authorization: "Bearer change-me"
#   timeout: 10
