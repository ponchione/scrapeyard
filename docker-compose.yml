services:
  egress-probe:
    image: python:3.12.11-alpine3.22@sha256:efcdfa6a6b2fd2afb9c7dfa9a5b288a6f68338b5cfdebe6b637d986067d85757
    command: ["python", "/opt/scrapeyard/egress_probe.py", "--challenge-port", "8080", "--liveness-port", "8081"]
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 32
    cpus: "0.25"
    mem_limit: 64m
    volumes:
      - ./security/egress_probe.py:/opt/scrapeyard/egress_probe.py:ro
    healthcheck:
      test: ["CMD", "python", "/opt/scrapeyard/egress_probe.py", "--healthcheck", "--challenge-port", "8080", "--liveness-port", "8081"]
      interval: 2s
      timeout: 1s
      retries: 10
    restart: unless-stopped
    networks:
      backend:
        ipv4_address: 172.30.0.248

  redis:
    image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    user: redis
    command: ["redis-server", "--appendonly", "yes"]
    init: true
    read_only: true
    cap_drop: ["ALL"]
    pids_limit: 128
    cpus: "1.0"
    mem_limit: 512m
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      backend:
        ipv4_address: 172.30.0.249

  scrapeyard:
    build: .
    command: ["uvicorn", "scrapeyard.main:app", "--host", "0.0.0.0", "--port", "8420", "--workers", "1"]
    deploy:
      replicas: 1
    init: true
    expose: ["8420"]
    depends_on:
      egress-probe:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["SYS_CHROOT"]
    security_opt:
      - "no-new-privileges:true"
      - "apparmor:scrapeyard-chromium"
      - "seccomp:./security/seccomp/chromium.json"
    pids_limit: 512
    cpus: "4.0"
    mem_limit: 4g
    shm_size: 1g
    stop_grace_period: 40s
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m,mode=1777
      - /run:rw,nosuid,nodev,noexec,size=16m,mode=0755
      - /home/scrapeyard/.cache:rw,nosuid,nodev,size=128m,uid=10001,gid=10001,mode=0700
      - /home/scrapeyard/.config:rw,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=0700
      - /home/scrapeyard/.local:rw,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=0700
      - /home/scrapeyard/.camoufox:rw,nosuid,nodev,noexec,size=16m,uid=10001,gid=10001,mode=0700
    volumes:
      - scrapeyard-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8420/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    environment:
      SCRAPEYARD_API_CREDENTIALS: "${SCRAPEYARD_API_CREDENTIALS:?set SCRAPEYARD_API_CREDENTIALS before running docker compose}"
      SCRAPEYARD_SECRET_REFERENCE_ALLOWLIST: "${SCRAPEYARD_SECRET_REFERENCE_ALLOWLIST:-}"
      SCRAPEYARD_ENCRYPTION_KEYS: "${SCRAPEYARD_ENCRYPTION_KEYS:?set SCRAPEYARD_ENCRYPTION_KEYS before running docker compose}"
      SCRAPEYARD_ENCRYPTION_ACTIVE_KEY_ID: "${SCRAPEYARD_ENCRYPTION_ACTIVE_KEY_ID:?set SCRAPEYARD_ENCRYPTION_ACTIVE_KEY_ID before running docker compose}"
      SCRAPEYARD_API_KEYS: "${SCRAPEYARD_API_KEYS:-}"
      SCRAPEYARD_MAX_REQUEST_BYTES: "${SCRAPEYARD_MAX_REQUEST_BYTES:-262144}"
      SCRAPEYARD_UNTRUSTED_SUBMISSIONS: "${SCRAPEYARD_UNTRUSTED_SUBMISSIONS:-true}"
      SCRAPEYARD_EGRESS_POLICY_PROBE_HOST: "${SCRAPEYARD_EGRESS_POLICY_PROBE_HOST:-172.30.0.248}"
      SCRAPEYARD_EGRESS_POLICY_PROBE_PORT: "${SCRAPEYARD_EGRESS_POLICY_PROBE_PORT:-8080}"
      SCRAPEYARD_EGRESS_POLICY_PROBE_LIVENESS_PORT: "${SCRAPEYARD_EGRESS_POLICY_PROBE_LIVENESS_PORT:-8081}"
      SCRAPEYARD_EGRESS_POLICY_PROBE_TIMEOUT_SECONDS: "${SCRAPEYARD_EGRESS_POLICY_PROBE_TIMEOUT_SECONDS:-1}"
      # Queue
      SCRAPEYARD_REDIS_DSN: "${SCRAPEYARD_REDIS_DSN:-redis://redis:6379/0}"
      SCRAPEYARD_QUEUE_NAME: "${SCRAPEYARD_QUEUE_NAME:-scrapeyard}"
      SCRAPEYARD_SYNC_TIMEOUT_SECONDS: "${SCRAPEYARD_SYNC_TIMEOUT_SECONDS:-15}"
      SCRAPEYARD_SYNC_POLL_DELAY_SECONDS: "${SCRAPEYARD_SYNC_POLL_DELAY_SECONDS:-0.5}"
      SCRAPEYARD_BASIC_FETCH_TIMEOUT_SECONDS: "${SCRAPEYARD_BASIC_FETCH_TIMEOUT_SECONDS:-30}"
      # Workers
      SCRAPEYARD_WORKERS_MAX_CONCURRENT: "${SCRAPEYARD_WORKERS_MAX_CONCURRENT:-4}"
      SCRAPEYARD_WORKERS_MAX_BROWSERS: "${SCRAPEYARD_WORKERS_MAX_BROWSERS:-2}"
      # Leave 1 GiB below the cgroup ceiling for active bodies/browsers/runtime overhead.
      SCRAPEYARD_WORKERS_MEMORY_LIMIT_MB: "${SCRAPEYARD_WORKERS_MEMORY_LIMIT_MB:-3072}"
      SCRAPEYARD_WORKERS_SHUTDOWN_GRACE_SECONDS: "${SCRAPEYARD_WORKERS_SHUTDOWN_GRACE_SECONDS:-30}"
      SCRAPEYARD_WORKERS_CANCELLATION_GRACE_SECONDS: "${SCRAPEYARD_WORKERS_CANCELLATION_GRACE_SECONDS:-10}"
      SCRAPEYARD_WORKERS_QUEUED_CLAIM_TIMEOUT_SECONDS: "${SCRAPEYARD_WORKERS_QUEUED_CLAIM_TIMEOUT_SECONDS:-300}"
      SCRAPEYARD_WORKERS_QUEUE_PAYLOAD_TTL_SECONDS: "${SCRAPEYARD_WORKERS_QUEUE_PAYLOAD_TTL_SECONDS:-604800}"
      SCRAPEYARD_WORKERS_QUEUED_RECONCILIATION_INTERVAL_SECONDS: "${SCRAPEYARD_WORKERS_QUEUED_RECONCILIATION_INTERVAL_SECONDS:-60}"
      SCRAPEYARD_WORKERS_QUEUED_RECONCILIATION_BATCH_SIZE: "${SCRAPEYARD_WORKERS_QUEUED_RECONCILIATION_BATCH_SIZE:-100}"
      SCRAPEYARD_WORKERS_RUNNING_HEARTBEAT_TIMEOUT_SECONDS: "${SCRAPEYARD_WORKERS_RUNNING_HEARTBEAT_TIMEOUT_SECONDS:-600}"
      SCRAPEYARD_WORKERS_RUNNING_RECONCILIATION_INTERVAL_SECONDS: "${SCRAPEYARD_WORKERS_RUNNING_RECONCILIATION_INTERVAL_SECONDS:-60}"
      SCRAPEYARD_WORKERS_RUNNING_RECONCILIATION_BATCH_SIZE: "${SCRAPEYARD_WORKERS_RUNNING_RECONCILIATION_BATCH_SIZE:-100}"
      SCRAPEYARD_WORKERS_HEARTBEAT_INTERVAL_SECONDS: "${SCRAPEYARD_WORKERS_HEARTBEAT_INTERVAL_SECONDS:-30}"
      SCRAPEYARD_WORKERS_REDIS_CONNECT_TIMEOUT_SECONDS: "${SCRAPEYARD_WORKERS_REDIS_CONNECT_TIMEOUT_SECONDS:-10}"
      # Aggregate run budgets
      SCRAPEYARD_RUN_MAX_DURATION_SECONDS: "${SCRAPEYARD_RUN_MAX_DURATION_SECONDS:-900}"
      SCRAPEYARD_RUN_MAX_FETCHED_BYTES: "${SCRAPEYARD_RUN_MAX_FETCHED_BYTES:-104857600}"
      SCRAPEYARD_RUN_MAX_EXTRACTED_RECORDS: "${SCRAPEYARD_RUN_MAX_EXTRACTED_RECORDS:-100000}"
      SCRAPEYARD_RUN_MAX_SERIALIZED_RESULT_BYTES: "${SCRAPEYARD_RUN_MAX_SERIALIZED_RESULT_BYTES:-52428800}"
      SCRAPEYARD_RUN_MAX_BROWSER_DEBUG_BYTES: "${SCRAPEYARD_RUN_MAX_BROWSER_DEBUG_BYTES:-26214400}"
      SCRAPEYARD_RUN_THREAD_MAX_WORKERS: "${SCRAPEYARD_RUN_THREAD_MAX_WORKERS:-4}"
      SCRAPEYARD_TRANSFORM_REGEX_TIMEOUT_SECONDS: "${SCRAPEYARD_TRANSFORM_REGEX_TIMEOUT_SECONDS:-0.1}"
      SCRAPEYARD_TRANSFORM_REGEX_MAX_PATTERN_BYTES: "${SCRAPEYARD_TRANSFORM_REGEX_MAX_PATTERN_BYTES:-2048}"
      SCRAPEYARD_TRANSFORM_MAX_PIPELINE_STEPS: "${SCRAPEYARD_TRANSFORM_MAX_PIPELINE_STEPS:-32}"
      SCRAPEYARD_TRANSFORM_MAX_VALUE_BYTES: "${SCRAPEYARD_TRANSFORM_MAX_VALUE_BYTES:-1048576}"
      # API admission and bounded administrative reads
      SCRAPEYARD_ADMIN_READ_DEFAULT_LIMIT: "${SCRAPEYARD_ADMIN_READ_DEFAULT_LIMIT:-100}"
      SCRAPEYARD_ADMIN_READ_MAX_LIMIT: "${SCRAPEYARD_ADMIN_READ_MAX_LIMIT:-500}"
      SCRAPEYARD_IDEMPOTENCY_KEY_MAX_BYTES: "${SCRAPEYARD_IDEMPOTENCY_KEY_MAX_BYTES:-128}"
      SCRAPEYARD_IDEMPOTENCY_RETENTION_HOURS: "${SCRAPEYARD_IDEMPOTENCY_RETENTION_HOURS:-24}"
      SCRAPEYARD_IDEMPOTENCY_CLEANUP_BATCH_SIZE: "${SCRAPEYARD_IDEMPOTENCY_CLEANUP_BATCH_SIZE:-1000}"
      SCRAPEYARD_RATE_LIMIT_REQUESTS: "${SCRAPEYARD_RATE_LIMIT_REQUESTS:-600}"
      SCRAPEYARD_RATE_LIMIT_WINDOW_SECONDS: "${SCRAPEYARD_RATE_LIMIT_WINDOW_SECONDS:-60}"
      SCRAPEYARD_RATE_LIMIT_MAX_KEYS: "${SCRAPEYARD_RATE_LIMIT_MAX_KEYS:-10000}"
      # Durable webhook retry and retention
      SCRAPEYARD_WEBHOOK_MAX_DELIVERY_ATTEMPTS: "${SCRAPEYARD_WEBHOOK_MAX_DELIVERY_ATTEMPTS:-5}"
      SCRAPEYARD_WEBHOOK_MAX_DELIVERY_AGE_SECONDS: "${SCRAPEYARD_WEBHOOK_MAX_DELIVERY_AGE_SECONDS:-86400}"
      SCRAPEYARD_WEBHOOK_DISPATCH_CONCURRENCY: "${SCRAPEYARD_WEBHOOK_DISPATCH_CONCURRENCY:-4}"
      SCRAPEYARD_WEBHOOK_DISPATCH_BATCH_SIZE: "${SCRAPEYARD_WEBHOOK_DISPATCH_BATCH_SIZE:-100}"
      SCRAPEYARD_WEBHOOK_CLIENT_CACHE_MAX_SIZE: "${SCRAPEYARD_WEBHOOK_CLIENT_CACHE_MAX_SIZE:-64}"
      SCRAPEYARD_WEBHOOK_CLIENT_CACHE_IDLE_TTL_SECONDS: "${SCRAPEYARD_WEBHOOK_CLIENT_CACHE_IDLE_TTL_SECONDS:-300}"
      SCRAPEYARD_WEBHOOK_DELIVERED_RETENTION_DAYS: "${SCRAPEYARD_WEBHOOK_DELIVERED_RETENTION_DAYS:-7}"
      SCRAPEYARD_WEBHOOK_FAILED_RETENTION_DAYS: "${SCRAPEYARD_WEBHOOK_FAILED_RETENTION_DAYS:-30}"
      # Bounded durable job/run/error/tombstone history
      SCRAPEYARD_HISTORY_ADHOC_JOB_RETENTION_DAYS: "${SCRAPEYARD_HISTORY_ADHOC_JOB_RETENTION_DAYS:-30}"
      SCRAPEYARD_HISTORY_SCHEDULED_RUN_RETENTION_DAYS: "${SCRAPEYARD_HISTORY_SCHEDULED_RUN_RETENTION_DAYS:-30}"
      SCRAPEYARD_HISTORY_SCHEDULED_RUN_RETENTION_COUNT: "${SCRAPEYARD_HISTORY_SCHEDULED_RUN_RETENTION_COUNT:-100}"
      SCRAPEYARD_HISTORY_ERROR_RETENTION_DAYS: "${SCRAPEYARD_HISTORY_ERROR_RETENTION_DAYS:-30}"
      SCRAPEYARD_HISTORY_WEBHOOK_TOMBSTONE_RETENTION_DAYS: "${SCRAPEYARD_HISTORY_WEBHOOK_TOMBSTONE_RETENTION_DAYS:-30}"
      SCRAPEYARD_HISTORY_ADHOC_JOB_CLEANUP_BATCH_SIZE: "${SCRAPEYARD_HISTORY_ADHOC_JOB_CLEANUP_BATCH_SIZE:-100}"
      SCRAPEYARD_HISTORY_SCHEDULED_RUN_CLEANUP_BATCH_SIZE: "${SCRAPEYARD_HISTORY_SCHEDULED_RUN_CLEANUP_BATCH_SIZE:-500}"
      SCRAPEYARD_HISTORY_ERROR_CLEANUP_BATCH_SIZE: "${SCRAPEYARD_HISTORY_ERROR_CLEANUP_BATCH_SIZE:-1000}"
      # Scheduler
      SCRAPEYARD_SCHEDULER_JITTER_MAX_SECONDS: "${SCRAPEYARD_SCHEDULER_JITTER_MAX_SECONDS:-120}"
      SCRAPEYARD_SCHEDULER_MISFIRE_GRACE_SECONDS: "${SCRAPEYARD_SCHEDULER_MISFIRE_GRACE_SECONDS:-60}"
      # Storage
      SCRAPEYARD_STORAGE_RETENTION_DAYS: "${SCRAPEYARD_STORAGE_RETENTION_DAYS:-30}"
      SCRAPEYARD_STORAGE_RESULTS_DIR: "${SCRAPEYARD_STORAGE_RESULTS_DIR:-/data/results}"
      SCRAPEYARD_STORAGE_MAX_RESULTS_PER_JOB: "${SCRAPEYARD_STORAGE_MAX_RESULTS_PER_JOB:-100}"
      SCRAPEYARD_STORAGE_CLEANUP_BATCH_SIZE: "${SCRAPEYARD_STORAGE_CLEANUP_BATCH_SIZE:-500}"
      SCRAPEYARD_STORAGE_ORPHAN_GRACE_SECONDS: "${SCRAPEYARD_STORAGE_ORPHAN_GRACE_SECONDS:-86400}"
      SCRAPEYARD_STORAGE_RECONCILIATION_DRY_RUN: "${SCRAPEYARD_STORAGE_RECONCILIATION_DRY_RUN:-true}"
      SCRAPEYARD_STORAGE_CLEANUP_INTERVAL_SECONDS: "${SCRAPEYARD_STORAGE_CLEANUP_INTERVAL_SECONDS:-21600}"
      SCRAPEYARD_STORAGE_CLEANUP_CYCLE_MAX_ITEMS_PER_PHASE: "${SCRAPEYARD_STORAGE_CLEANUP_CYCLE_MAX_ITEMS_PER_PHASE:-10000}"
      SCRAPEYARD_STORAGE_CLEANUP_CYCLE_MAX_SECONDS: "${SCRAPEYARD_STORAGE_CLEANUP_CYCLE_MAX_SECONDS:-60}"
      SCRAPEYARD_STORAGE_CLEANUP_CATCHUP_DELAY_SECONDS: "${SCRAPEYARD_STORAGE_CLEANUP_CATCHUP_DELAY_SECONDS:-5}"
      # Data directories
      SCRAPEYARD_DB_DIR: "${SCRAPEYARD_DB_DIR:-/data/db}"
      SCRAPEYARD_ADAPTIVE_DIR: "${SCRAPEYARD_ADAPTIVE_DIR:-/data/adaptive}"
      SCRAPEYARD_LOG_DIR: "${SCRAPEYARD_LOG_DIR:-/data/logs}"
      SCRAPEYARD_BROWSER_DEBUG_ENABLED: "${SCRAPEYARD_BROWSER_DEBUG_ENABLED:-false}"
      # Circuit breaker
      SCRAPEYARD_CIRCUIT_BREAKER_MAX_FAILURES: "${SCRAPEYARD_CIRCUIT_BREAKER_MAX_FAILURES:-3}"
      SCRAPEYARD_CIRCUIT_BREAKER_COOLDOWN_SECONDS: "${SCRAPEYARD_CIRCUIT_BREAKER_COOLDOWN_SECONDS:-300}"
      SCRAPEYARD_CIRCUIT_BREAKER_MAX_DOMAINS: "${SCRAPEYARD_CIRCUIT_BREAKER_MAX_DOMAINS:-10000}"
      SCRAPEYARD_CIRCUIT_BREAKER_INACTIVE_TTL_SECONDS: "${SCRAPEYARD_CIRCUIT_BREAKER_INACTIVE_TTL_SECONDS:-3600}"
      # Runtime validation rejects an empty/direct proxy whenever untrusted
      # submissions are enabled. Keeping interpolation optional permits the
      # explicitly trusted local and qualification overlays below.
      SCRAPEYARD_PROXY_URL: "${SCRAPEYARD_PROXY_URL:-}"
      SCRAPEYARD_LOG_LEVEL: "${SCRAPEYARD_LOG_LEVEL:-INFO}"
      SCRAPEYARD_DOMAIN_RATE_LIMIT_SHARED: "${SCRAPEYARD_DOMAIN_RATE_LIMIT_SHARED:-true}"
      SCRAPEYARD_DOMAIN_RATE_LIMIT_MAX_DOMAINS: "${SCRAPEYARD_DOMAIN_RATE_LIMIT_MAX_DOMAINS:-10000}"
      # Detailed readiness and metrics
      SCRAPEYARD_HEALTH_DISK_FREE_MIN_MB: "${SCRAPEYARD_HEALTH_DISK_FREE_MIN_MB:-100}"
      SCRAPEYARD_HEALTH_INCLUDE_PROJECTS: "${SCRAPEYARD_HEALTH_INCLUDE_PROJECTS:-false}"
      SCRAPEYARD_HEALTH_PROBE_TIMEOUT_SECONDS: "${SCRAPEYARD_HEALTH_PROBE_TIMEOUT_SECONDS:-2}"
      SCRAPEYARD_METRICS_REFRESH_INTERVAL_SECONDS: "${SCRAPEYARD_METRICS_REFRESH_INTERVAL_SECONDS:-5}"
    restart: unless-stopped
    networks:
      backend:
        ipv4_address: 172.30.0.250

volumes:
  redis-data:
  scrapeyard-data:

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.0/25
