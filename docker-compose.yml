services:
  redis:
    image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    user: redis
    command: ["redis-server", "--appendonly", "yes"]
    init: true
    read_only: true
    cap_drop: ["ALL"]
    pids_limit: 128
    cpus: "1.0"
    mem_limit: 512m
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      backend:
        ipv4_address: 172.30.0.249

  scrapeyard:
    build: .
    command: ["uvicorn", "scrapeyard.main:app", "--host", "0.0.0.0", "--port", "8420", "--workers", "1"]
    deploy:
      replicas: 1
    init: true
    expose: ["8420"]
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["SYS_CHROOT"]
    security_opt:
      - "no-new-privileges:true"
      - "apparmor:scrapeyard-chromium"
      - "seccomp:./security/seccomp/chromium.json"
    pids_limit: 512
    cpus: "4.0"
    mem_limit: 4g
    shm_size: 1g
    stop_grace_period: 40s
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m,mode=1777
      - /run:rw,nosuid,nodev,noexec,size=16m,mode=0755
      - /home/scrapeyard/.cache:rw,nosuid,nodev,size=128m,uid=10001,gid=10001,mode=0700
      - /home/scrapeyard/.config:rw,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=0700
      - /home/scrapeyard/.local:rw,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=0700
      - /home/scrapeyard/.camoufox:rw,nosuid,nodev,noexec,size=16m,uid=10001,gid=10001,mode=0700
    volumes:
      - scrapeyard-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8420/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    environment:
      SCRAPEYARD_API_CREDENTIALS: "${SCRAPEYARD_API_CREDENTIALS:?set SCRAPEYARD_API_CREDENTIALS before running docker compose}"
      SCRAPEYARD_SECRET_REFERENCE_ALLOWLIST: "${SCRAPEYARD_SECRET_REFERENCE_ALLOWLIST:-}"
      SCRAPEYARD_ENCRYPTION_KEYS: "${SCRAPEYARD_ENCRYPTION_KEYS:?set SCRAPEYARD_ENCRYPTION_KEYS before running docker compose}"
      SCRAPEYARD_ENCRYPTION_ACTIVE_KEY_ID: "${SCRAPEYARD_ENCRYPTION_ACTIVE_KEY_ID:?set SCRAPEYARD_ENCRYPTION_ACTIVE_KEY_ID before running docker compose}"
      # Queue
      SCRAPEYARD_REDIS_DSN: "redis://redis:6379/0"
      SCRAPEYARD_QUEUE_NAME: "scrapeyard"
      SCRAPEYARD_SYNC_TIMEOUT_SECONDS: "15"
      # Workers
      SCRAPEYARD_WORKERS_MAX_CONCURRENT: "4"
      SCRAPEYARD_WORKERS_MAX_BROWSERS: "2"
      SCRAPEYARD_WORKERS_MEMORY_LIMIT_MB: "4096"
      SCRAPEYARD_WORKERS_CANCELLATION_GRACE_SECONDS: "10"
      SCRAPEYARD_WORKERS_QUEUED_CLAIM_TIMEOUT_SECONDS: "300"
      SCRAPEYARD_WORKERS_QUEUE_PAYLOAD_TTL_SECONDS: "604800"
      SCRAPEYARD_WORKERS_QUEUED_RECONCILIATION_INTERVAL_SECONDS: "60"
      SCRAPEYARD_WORKERS_QUEUED_RECONCILIATION_BATCH_SIZE: "100"
      SCRAPEYARD_WORKERS_RUNNING_HEARTBEAT_TIMEOUT_SECONDS: "600"
      SCRAPEYARD_WORKERS_HEARTBEAT_INTERVAL_SECONDS: "30"
      # Aggregate run budgets
      SCRAPEYARD_RUN_MAX_DURATION_SECONDS: "900"
      SCRAPEYARD_RUN_MAX_FETCHED_BYTES: "104857600"
      SCRAPEYARD_RUN_MAX_EXTRACTED_RECORDS: "100000"
      SCRAPEYARD_RUN_MAX_SERIALIZED_RESULT_BYTES: "52428800"
      SCRAPEYARD_RUN_MAX_BROWSER_DEBUG_BYTES: "26214400"
      SCRAPEYARD_TRANSFORM_REGEX_TIMEOUT_SECONDS: "0.1"
      SCRAPEYARD_TRANSFORM_REGEX_MAX_PATTERN_BYTES: "2048"
      SCRAPEYARD_TRANSFORM_MAX_PIPELINE_STEPS: "32"
      SCRAPEYARD_TRANSFORM_MAX_VALUE_BYTES: "1048576"
      # Durable webhook retry and retention
      SCRAPEYARD_WEBHOOK_MAX_DELIVERY_ATTEMPTS: "5"
      SCRAPEYARD_WEBHOOK_MAX_DELIVERY_AGE_SECONDS: "86400"
      SCRAPEYARD_WEBHOOK_DISPATCH_CONCURRENCY: "4"
      SCRAPEYARD_WEBHOOK_DISPATCH_BATCH_SIZE: "100"
      SCRAPEYARD_WEBHOOK_DELIVERED_RETENTION_DAYS: "7"
      SCRAPEYARD_WEBHOOK_FAILED_RETENTION_DAYS: "30"
      # Bounded durable job/run/error/tombstone history
      SCRAPEYARD_HISTORY_ADHOC_JOB_RETENTION_DAYS: "30"
      SCRAPEYARD_HISTORY_SCHEDULED_RUN_RETENTION_DAYS: "30"
      SCRAPEYARD_HISTORY_SCHEDULED_RUN_RETENTION_COUNT: "100"
      SCRAPEYARD_HISTORY_ERROR_RETENTION_DAYS: "30"
      SCRAPEYARD_HISTORY_WEBHOOK_TOMBSTONE_RETENTION_DAYS: "30"
      SCRAPEYARD_HISTORY_ADHOC_JOB_CLEANUP_BATCH_SIZE: "100"
      SCRAPEYARD_HISTORY_SCHEDULED_RUN_CLEANUP_BATCH_SIZE: "500"
      SCRAPEYARD_HISTORY_ERROR_CLEANUP_BATCH_SIZE: "1000"
      # Scheduler
      SCRAPEYARD_SCHEDULER_JITTER_MAX_SECONDS: "120"
      # Storage
      SCRAPEYARD_STORAGE_RETENTION_DAYS: "30"
      SCRAPEYARD_STORAGE_RESULTS_DIR: "/data/results"
      SCRAPEYARD_STORAGE_MAX_RESULTS_PER_JOB: "100"
      SCRAPEYARD_STORAGE_CLEANUP_BATCH_SIZE: "500"
      SCRAPEYARD_STORAGE_ORPHAN_GRACE_SECONDS: "86400"
      SCRAPEYARD_STORAGE_RECONCILIATION_DRY_RUN: "true"
      SCRAPEYARD_STORAGE_CLEANUP_INTERVAL_SECONDS: "21600"
      # Data directories
      SCRAPEYARD_DB_DIR: "/data/db"
      SCRAPEYARD_ADAPTIVE_DIR: "/data/adaptive"
      SCRAPEYARD_LOG_DIR: "/data/logs"
      # Circuit breaker
      SCRAPEYARD_CIRCUIT_BREAKER_MAX_FAILURES: "3"
      SCRAPEYARD_CIRCUIT_BREAKER_COOLDOWN_SECONDS: "300"
    restart: unless-stopped
    networks:
      backend:
        ipv4_address: 172.30.0.250

volumes:
  redis-data:
  scrapeyard-data:

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.0/25
