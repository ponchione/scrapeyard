services:
  redis:
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --aof-use-rdb-preamble
      - "yes"
    restart: "no"

  fixture:
    restart: "no"

  scrapeyard:
    restart: "no"
    cpus: "${SCRAPEYARD_QUALIFICATION_CPUS:-4}"
    mem_limit: "${SCRAPEYARD_QUALIFICATION_MEMORY_LIMIT:-8g}"
    stop_grace_period: 40s
    healthcheck:
      interval: 2s
      timeout: 3s
      start_period: 2s
      retries: 3
    tmpfs:
      - /run/scrapeyard-qualification:uid=10001,gid=10001,mode=0700
    environment:
      # Qualification submits only repository-owned fixture configurations.
      # Production keeps the base file's fail-closed untrusted mode enabled.
      SCRAPEYARD_UNTRUSTED_SUBMISSIONS: "false"
      SCRAPEYARD_EGRESS_POLICY_PROBE_HOST: ""
      SCRAPEYARD_EGRESS_POLICY_PROBE_PORT: "0"
      SCRAPEYARD_EGRESS_POLICY_PROBE_LIVENESS_PORT: "0"
      SCRAPEYARD_QUALIFICATION_MODE: "true"
      SCRAPEYARD_QUALIFICATION_CRASH_POINT: "${SCRAPEYARD_QUALIFICATION_CRASH_POINT:-}"
      SCRAPEYARD_QUALIFICATION_MARKER_DIR: /run/scrapeyard-qualification
      SCRAPEYARD_WORKERS_MAX_CONCURRENT: "4"
      SCRAPEYARD_WORKERS_MAX_BROWSERS: "2"
      SCRAPEYARD_WORKERS_QUEUED_CLAIM_TIMEOUT_SECONDS: "5"
      SCRAPEYARD_WORKERS_RUNNING_HEARTBEAT_TIMEOUT_SECONDS: "6"
      SCRAPEYARD_WORKERS_HEARTBEAT_INTERVAL_SECONDS: "2"
      SCRAPEYARD_WORKERS_REDIS_CONNECT_TIMEOUT_SECONDS: "5"
      SCRAPEYARD_BASIC_FETCH_TIMEOUT_SECONDS: "40"
      SCRAPEYARD_RUN_MAX_DURATION_SECONDS: "30"
      SCRAPEYARD_RUN_MAX_FETCHED_BYTES: "8388608"
      SCRAPEYARD_RUN_MAX_EXTRACTED_RECORDS: "1000"
      SCRAPEYARD_RUN_MAX_SERIALIZED_RESULT_BYTES: "2097152"
      SCRAPEYARD_MAX_REQUEST_BYTES: "65536"
      SCRAPEYARD_STORAGE_MAX_RESULTS_PER_JOB: "4"
      SCRAPEYARD_STORAGE_ORPHAN_GRACE_SECONDS: "1"
      SCRAPEYARD_STORAGE_RECONCILIATION_DRY_RUN: "false"
      SCRAPEYARD_STORAGE_RECONCILIATION_PROMOTION_ACK: "2026-07-16T00:00:00Z"
      SCRAPEYARD_STORAGE_CLEANUP_INTERVAL_SECONDS: "5"
      SCRAPEYARD_WEBHOOK_MAX_DELIVERY_ATTEMPTS: "3"
      SCRAPEYARD_WEBHOOK_MAX_DELIVERY_AGE_SECONDS: "120"
      SCRAPEYARD_WEBHOOK_DELIVERED_RETENTION_DAYS: "1"
      SCRAPEYARD_WEBHOOK_FAILED_RETENTION_DAYS: "1"
      SCRAPEYARD_WEBHOOK_DISPATCH_CONCURRENCY: "2"
      SCRAPEYARD_WEBHOOK_DISPATCH_BATCH_SIZE: "8"
      SCRAPEYARD_RATE_LIMIT_REQUESTS: "0"
      SCRAPEYARD_HEALTH_INCLUDE_PROJECTS: "true"
      SCRAPEYARD_HEALTH_DISK_FREE_MIN_MB: "${SCRAPEYARD_HEALTH_DISK_FREE_MIN_MB:-10}"
