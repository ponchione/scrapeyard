[project]
name = "scrapeyard"
version = "0.6.0"
description = "Config-driven web scraping microservice built on Scrapling"
authors = []
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi>=0.136.1,<0.137.0",
    "uvicorn[standard]>=0.34.0,<0.35.0",
    # Scrapling 0.3+ removed browser internals instrumented by browser_debug.py.
    "scrapling>=0.2.99,<0.3",
    # Browser drivers are pinned exactly: the Dockerfile installs and asserts
    # the browser builds that match these versions.
    "playwright==1.58.0",
    "rebrowser-playwright==1.52.0",
    "camoufox==0.4.11",
    # Scrapling 0.2 passes a deprecated no-op parser option. Keep the temporary,
    # exact test warning filter bounded to this security-fixed lxml API line.
    "lxml>=6.1.1,<6.2.0",
    "arq>=0.26,<0.27",
    "redis>=5.3.1,<6.0.0",
    "starlette>=1.3.1,<2.0.0",
    "tldextract>=5.3.1,<6.0.0",
    "apscheduler>=3.10,<4.0",
    "pyyaml>=6.0,<7.0",
    "aiosqlite>=0.20,<0.21",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "httpx>=0.28,<0.29",
    "cryptography>=50.0.2,<51.0.0",
    "prometheus-client>=0.22.1,<0.23.0",
    "regex (>=2026.6.28,<2027.0.0)",
]

[tool.poetry]
packages = [{include = "scrapeyard", from = "src"}]
include = [{path = "sql/*.sql", format = ["sdist", "wheel"]}]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"
pytest-timeout = "^2.4.0"
ruff = "^0.16.9"
respx = "^0.22.0"
pytest-cov = "^6.0"
mypy = "^1.20.0"
pip-audit = "^2.9.0"
types-pyyaml = "^6.0.12.20250915"
types-regex = ">=2026.6.28,<2027.0.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=scrapeyard --cov-report=term-missing:skip-covered --cov-report=html --cov-fail-under=80 --timeout=60"
markers = [
    "live_redis: exercises the real Redis-backed queue path",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "C4", "SIM"]
ignore = ["E501", "UP035", "SIM105", "SIM110"]

[tool.ruff.lint.per-file-ignores]
"src/scrapeyard/api/routes.py" = ["B008"]
# The models keep Optional/Union spellings; ruff 0.10 moved Optional to UP045.
"src/scrapeyard/config/schema.py" = ["UP007", "UP045"]
"src/scrapeyard/models/job.py" = ["UP007", "UP045"]
"tests/**/*.py" = ["B007", "C408", "SIM117"]

[tool.ruff.lint.isort]
# Keep `import x as x` re-exports in the same statement as their siblings.
combine-as-imports = true

[tool.mypy]
python_version = "3.10"
strict = true
# Full first-party production scope: poetry run mypy src/scrapeyard

[[tool.mypy.overrides]]
module = [
    "scrapling.*",
    "arq.*",
    "apscheduler.*",
    "aiosqlite.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["scrapeyard"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
skip_covered = true
sort = "Cover"
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.$",
]

[tool.coverage.html]
directory = "htmlcov"
title = "Scrapeyard coverage report"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
