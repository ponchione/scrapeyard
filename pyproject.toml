[project]
name = "scrapeyard"
version = "0.6.0"
description = "Config-driven web scraping microservice built on Scrapling"
authors = []
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi>=0.136.1,<0.137.0",
    "uvicorn[standard]>=0.34.0,<0.35.0",
    "scrapling>=0.2,<0.3",
    "arq>=0.26,<0.27",
    "apscheduler>=3.10,<4.0",
    "pyyaml>=6.0,<7.0",
    "aiosqlite>=0.20,<0.21",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "httpx>=0.28,<0.29",
    "cryptography>=48.0.1,<49.0.0",
    "prometheus-client>=0.22.1,<0.23.0",
]

[tool.poetry]
packages = [{include = "scrapeyard", from = "src"}]
include = [{path = "sql/*.sql", format = ["sdist", "wheel"]}]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"
pytest-timeout = "^2.4.0"
ruff = "^0.9"
respx = "^0.22.0"
pytest-cov = "^6.0"
mypy = "^1.20.0"
pip-audit = "^2.9.0"
types-pyyaml = "^6.0.12.20250915"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=scrapeyard --cov-report=term-missing:skip-covered --cov-report=html --cov-fail-under=80 --timeout=60"
markers = [
    "live_redis: exercises the real Redis-backed queue path",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "C4", "SIM"]
ignore = ["E501", "I001", "UP035", "UP038", "SIM105", "SIM110"]

[tool.ruff.lint.per-file-ignores]
"src/scrapeyard/api/routes.py" = ["B008"]
"src/scrapeyard/config/schema.py" = ["UP007"]
"src/scrapeyard/models/job.py" = ["UP007"]
"tests/**/*.py" = ["B007", "C408", "SIM117"]

[tool.mypy]
python_version = "3.10"
strict = true
# Full first-party production scope: poetry run mypy src/scrapeyard

[[tool.mypy.overrides]]
module = [
    "scrapling.*",
    "arq.*",
    "apscheduler.*",
    "aiosqlite.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["scrapeyard"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
skip_covered = true
sort = "Cover"
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.$",
]

[tool.coverage.html]
directory = "htmlcov"
title = "Scrapeyard coverage report"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
